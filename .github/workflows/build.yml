name: Build release APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Model indir
        run: |
          mkdir -p app/src/main/assets
          curl -L -o app/src/main/assets/pose_landmarker_lite.task https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task
      - name: Imza anahtari olustur
        run: keytool -genkeypair -keystore release.jks -alias altiyedi -keyalg RSA -keysize 2048 -validity 10000 -storepass altiyedi123 -keypass altiyedi123 -dname "CN=AltiYedi"
      - run: gradle assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: altiyedi-release-apk
          path: app/build/outputs/apk/release/app-release.apk
